[package]
name = "meme-na-gaveta"
version = "0.2.0"
description = "Organizador de memes para Windows (portátil)"
edition = "2021"

[lib]
name = "meme_na_gaveta_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clipboard-win = "5.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-drag = "2.1.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
trash = "5.2.9"
uuid = { version = "1.29.0", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"

# Binário pequeno: otimiza para tamanho, LTO e sem símbolos.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
